[project]
name = "ft-model2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.1",
    "datasets>=4.1.0,<4.4.0",
    "huggingface-hub>=1.27.0",
    "orjson>=3.12.0",
    "pandas>=2.2.2,<3.0.0",
    "peft>=0.20.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tokenizers>=0.22.2",
    "torch",
    "torchvision",
    "tqdm>=4.70.0",
    "transformers>=4.51.3,<5.5.0",
    "trl>=0.18.2,<0.24.0",
    "unsloth[windows]>=2025.7.2",
    "wandb>=0.25.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
unsloth = { git = "https://github.com/unslothai/unsloth.git" }


